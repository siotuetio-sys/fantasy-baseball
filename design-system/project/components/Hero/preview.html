<head><meta charset="utf-8"><title>Hero</title>
<style>body{padding:16px;background:var(--bg)}</style></head>
<body>
<section class="hero">

    <div class="pillrow"><button class="btn">看各項戰況 →</button><button class="btn ghost">今日先發建議</button><span class="pill" style="background:var(--bg);border:1.5px solid var(--line);font-size:12.5px;padding:6px 14px;font-weight:700;color:var(--text)">10/14（三）</span></div>
  </div>
  <div class="hero-art"><div class="bubble">9 人先發、3 人坐板凳。<br>我已經幫你排好了！</div><img src="/_blob/dfc7e7117a669d90c8365e271fa4feb6" alt=""></div>
</section>
</body>
</html>
