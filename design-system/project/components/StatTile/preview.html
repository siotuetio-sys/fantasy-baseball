<!doctype html>
<html lang="zh-Hant">
<head><meta charset="utf-8"><title>StatTile</title>

<body>
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(150px,1fr))">

  <div class="stat kpi-link"><span class="arrow">›</span><div class="v">15</div><div class="k">今日場次</div></div>

  <div class="stat kpi-link"><span class="arrow">›</span><div class="v tag-warn">2</div><div class="k">傷兵警示</div></div>
</div>
</body>
</html>
